<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunrise – Guardian Dashboard Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8F0EE;--card:#fff;--ink:#0A1C24;--mute:#60797F;--line:#E3ECEA;--soft:#F1F6F5;--p1:#1E6F78;--p2:#0F3B44;--acc:#F59E6C;--sh:0 6px 20px rgba(15,59,68,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#071419;--card:#0F2A33;--ink:#F6F1E7;--mute:#9DB5B5;--line:#1F3E47;--soft:#14323C;--sh:none}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 Manrope,system-ui,sans-serif;height:100vh;overflow:hidden}
h1,h2,h3,.hd{font-family:'Bricolage Grotesque',Georgia,serif;letter-spacing:-.02em}
.app{display:grid;grid-template-columns:240px 1fr;gap:12px;padding:12px;height:100vh}
.sb{background:var(--card);border-radius:28px;padding:20px 12px;display:flex;flex-direction:column;box-shadow:var(--sh)}
.logo{padding:4px 12px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.logo b{font:800 18px 'Bricolage Grotesque',serif}.logo small{display:block;font-size:10px;letter-spacing:.14em;color:var(--mute)}
.nv{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;color:var(--mute);font-weight:600;cursor:pointer;margin-bottom:4px}
.nv.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:0 8px 18px rgba(15,59,68,.25)}
.nv:hover:not(.on){background:var(--soft)}
.lo{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;color:#C0392B;border-radius:0}
.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mn{background:var(--card);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);min-width:0}
.tb{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line)}
.sq{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;border:0;color:var(--ink);cursor:pointer;position:relative}
.tb h1{font-size:17px}.tb small{color:var(--mute);font-size:12px}
.us{margin-left:auto;display:flex;align-items:center;gap:12px}.us small{display:block;font-size:10px;letter-spacing:.1em}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#E7C9A3)}
.bd{position:absolute;top:-5px;right:-5px;background:var(--acc);color:#0A1C24;font:700 10px Manrope;border-radius:9px;padding:1px 5px}
.ct{padding:22px;overflow:auto;flex:1}
.pt h2{font-size:26px}.pt p{color:var(--mute);margin:4px 0 18px}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.in{flex:1;min-width:200px;background:var(--soft);border-radius:16px;padding:0 16px;display:flex;align-items:center;gap:10px;height:46px;color:var(--mute)}
.in input{border:0;background:transparent;flex:1;font:inherit;color:var(--ink);outline:0}
.pb{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border:0;border-radius:14px 14px 14px 4px;padding:0 20px;height:46px;font:700 14px Manrope,sans-serif;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.sel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px;height:46px;min-width:190px}
.sel small{display:block;font-size:10px;letter-spacing:.1em;color:var(--mute)}.sel b{font-size:14px}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ch{padding:7px 14px;border-radius:12px;background:var(--soft);font-weight:600;font-size:12px;color:var(--mute);cursor:pointer}
.ch.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.cd h3{font-size:16px}.cd p{color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.tg{display:inline-flex;gap:5px;align-items:center;padding:3px 10px;border-radius:9px;font-size:11px;font-weight:700;background:var(--soft);color:var(--mute)}
.g{background:#DDF3E8;color:#1F7A4D}.a{background:#FCEBC8;color:#9A5B00}.r{background:#FADADD;color:#B3263E}.b{background:#DCEBF5;color:#1E5C86}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font:700 13px Manrope,sans-serif;color:var(--ink);cursor:pointer;margin-left:auto}
.tl{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font:800 15px 'Bricolage Grotesque',serif;flex:none}
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.sc{border-radius:20px;padding:16px 18px;background:var(--card);border:1px solid var(--line)}
.sc small{font-size:11px;letter-spacing:.08em;font-weight:700;color:var(--mute);text-transform:uppercase;display:flex;justify-content:space-between}
.sc b{font:800 28px 'Bricolage Grotesque',serif;display:block;margin-top:6px}.sc span{color:var(--mute);font-size:12px}
.ta{background:rgba(232,168,56,.14);border-color:transparent}.ta b,.ta small{color:#B7791F}
.tr{background:rgba(214,69,90,.12);border-color:transparent}.tr b,.tr small{color:#C23A52}
.tg2{background:rgba(48,160,110,.13);border-color:transparent}.tg2 b,.tg2 small{color:#23895B}
.tbl{background:rgba(70,140,190,.12);border-color:transparent}.tbl b,.tbl small{color:#2A6E9C}
.bn{border-radius:22px;padding:22px 26px;background:linear-gradient(120deg,var(--p2),var(--p1));color:#F6F1E7;margin-bottom:16px}
.bn small{letter-spacing:.14em;font-size:11px;font-weight:700;color:var(--acc)}.bn h2{font-size:26px;margin-top:4px}
.dg{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}
.tt{display:grid;grid-template-columns:44px repeat(5,1fr);gap:6px;margin-top:14px}
.tt .h{text-align:center;font-size:11px;color:var(--mute);font-weight:700}.tt .h b{display:block;font-size:14px;color:var(--ink)}
.tt .t{font-size:11px;color:var(--mute);padding-top:9px}
.tt .s{padding:9px 10px;border-radius:10px;font-size:12px;font-weight:700;color:#0A1C24}
.an{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--soft);margin-bottom:10px}
.an h3{font-size:14px;display:flex;gap:8px;align-items:center}.an p{font-size:12px;color:var(--mute)}
.ib{width:36px;height:36px;border-radius:11px;background:rgba(30,111,120,.14);color:var(--p1);display:grid;place-items:center;flex:none}
.dt{width:44px;height:48px;border-radius:12px;background:rgba(30,111,120,.12);color:var(--p1);text-align:center;font:700 10px Manrope,sans-serif;padding-top:7px;flex:none}.dt b{display:block;font:800 16px 'Bricolage Grotesque',serif;color:var(--ink)}
.rg{width:150px;height:150px;border-radius:50%;border:12px solid var(--soft);display:grid;place-items:center;text-align:center;color:var(--mute);font-size:12px}
.pr{display:flex;gap:12px;align-items:center;margin-bottom:12px}.pr i{width:34px;height:34px;border-radius:10px;flex:none}
.pr div{flex:1}.pr u{display:block;height:6px;border-radius:3px;background:var(--line);margin-top:6px}
.em{text-align:center;padding:36px;color:var(--mute)}.em b{display:block;color:var(--ink);margin-bottom:4px}
.md{position:fixed;inset:0;background:rgba(5,15,20,.55);display:none;place-items:center;z-index:20}.md.on{display:grid}
.mc{background:var(--card);width:470px;max-width:92vw;max-height:90vh;overflow:auto;border-radius:24px}
.mh{background:linear-gradient(120deg,var(--p2),var(--p1));color:#fff;padding:20px 24px;display:flex;justify-content:space-between}
.mh p{font-size:13px;opacity:.8}.mb{padding:20px 24px;display:grid;gap:14px}
.mb label{font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--mute)}
.mb input,.mb textarea{width:100%;margin-top:6px;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:12px 14px;font:inherit;color:var(--ink)}
.mb .row{justify-content:flex-end}
@media(max-width:860px){.app{grid-template-columns:1fr}.sb{display:none}.sb.open{display:flex;position:fixed;inset:12px auto 12px 12px;width:240px;z-index:9}.st4{grid-template-columns:1fr 1fr}.dg{grid-template-columns:1fr}.us div{display:none}.tt{font-size:10px}}
</style></head><body>
<div class="app"><aside class="sb" id="sb"><div class="logo"><b>Sunrise</b><small>MODEL SCHOOL</small></div><div id="nv"></div><div class="nv lo"><svg class="i" viewBox="0 0 24 24"><path d="M10 4H4v16h6M14 8l5 4-5 4M19 12H9"/></svg>Logout</div></aside>
<main class="mn"><div class="tb"><button class="sq" id="tg" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14"/></svg></button><div><h1 id="tt">Dashboard</h1><small id="ts"></small></div>
<div class="us"><button class="sq"><svg class="i" viewBox="0 0 24 24"><path d="M3 10v4h4l8 5V5L7 10zM18 9v6"/></svg><span class="bd">8</span></button><span class="av"></span><div><b>Ama Asante</b><small style="color:var(--mute)">GUARDIAN</small></div></div></div>
<div class="ct" id="ct"></div></main></div>
<div class="md" id="md"><div class="mc"><div class="mh"><div><h3 style="font-size:20px">Make Complaint</h3><p>File a new incident report for review.</p></div><span id="mx" style="cursor:pointer;font-size:22px">×</span></div>
<div class="mb"><div><label>TITLE</label><input placeholder="Brief summary of the incident"></div><div class="row"><div style="flex:1"><label>CATEGORY</label><input placeholder="Select category"></div><div style="flex:1"><label>SEVERITY</label><input placeholder="Select severity"></div></div><div><label>REPORTED PARTY</label><input placeholder="Who was involved"></div><div><label>DESCRIPTION</label><textarea rows="3" placeholder="Describe what happened..."></textarea></div><div class="row"><button class="ghost" id="mc2" style="margin:0">Cancel</button><button class="pb">Submit complaint</button></div></div></div></div>
<script>
const I={grid:"M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z",cap:"M2 9l10-5 10 5-10 5zM6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5",book:"M3 5h7a2 2 0 012 2v12a2 2 0 00-2-2H3zM21 5h-7a2 2 0 00-2 2v12a2 2 0 012-2h7z",clip:"M9 3h6v3H9zM6 5h12v16H6z",doc:"M6 3h9l4 4v14H6zM9 12h7M9 16h7",cal:"M4 6h16v14H4zM4 10h16M8 3v4M16 3v4",chart:"M5 20v-8M12 20V5M19 20v-5",mega:"M3 10v4h4l8 5V5L7 10zM18 9v6",dollar:"M12 3v18M16 7h-6a3 3 0 000 6h4a3 3 0 010 6H8",search:"M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5",plus:"M12 5v14M5 12h14",tag:"M3 3h8l10 10-8 8L3 11z"};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${I[n]}"/></svg>`;
const N=[["dash","Dashboard","grid","Fri 7 Aug · Your day, lessons, and progress at a glance"],["stu","Students","cap","Enrollment and student records"],["les","Lessons","book","Lesson plans and teaching sessions"],["hw","Homeworks","clip","Homework and coursework tasks"],["ex","Exams","doc","Assessments and exam sessions"],["att","Attendance","cal","Lesson roll call and presence records"],["cmp","Complaints","chart","Incidents and case records"],["ann","Announcements","mega","School notices and updates"],["pay","Payments","dollar","Invoices and payment history"]];
const H=(t,s)=>`<div class="pt"><h2>${t}</h2><p>${s}</p></div>`;
const B=(ph,x='')=>`<div class="bar">${x}<div class="in">${ic('search')}<input placeholder="${ph}"></div><button class="pb">${ic('search')}Search</button></div>`;
const S=(l,v)=>`<div class="sel"><small>${l}</small><b>${v}</b></div>`;
const C=a=>`<div class="chips">${a.map((x,i)=>`<span class="ch${i?'':' on'}">${x}</span>`).join('')}</div>`;
const SH=(n,w)=>`<div style="margin:6px 0 14px;color:var(--mute)">Showing <b style="color:var(--ink)">${n}</b> ${w}</div>`;
const K={Math:'#D6ECEC',English:'#E8E4F3',Biology:'#E3EAEE',Physics:'#F6E7CF',Chemistry:'#E8E4F3',Geography:'#DDEBDD',History:'#FBDCCF',Music:'#FBDCCF'};
const TT=[["8 AM","Math","English","Math","English","Math"],["9 AM","English","Math","English","Math","English"],["10 AM","Biology","Physics","Chemistry","English","Music"],["11 AM","Physics","Chemistry","Geography","History","Chemistry"],["1 PM","Music","History","Physics","Chemistry","Geography"]];
const PC={High:'a',Medium:'b',Low:'g'};
const AN=[["Career Guidance Week","Medium","Grade 9 and 10 students meet counsellors for senior-track planning.","Students, Guardians, Teachers","Academic"],["Health Screening Day","Medium","School nurse will run basic health checks on Thursday.","Students, Guardians","General"],["Welcome Back Assembly","Low","All students and staff are invited to the assembly on Monday at 8:00 AM.","All","General"],["Midterm Exam Timetable","High","Midterm examinations begin next week. Please check the notice board.","Students, Guardians, Teachers","Academic"],["Fee Payment Deadline","High","Term 2 tuition balances are due within three weeks.","Guardians, Students","General"],["PTA Meeting Notice","Medium","The PTA meeting is scheduled for Saturday at 10:00 AM.","Guardians, Teachers","General"]];
const la=(t,s,x)=>`<div class="cd"><div class="row"><span class="tl">A</span><div><h3>${t}</h3><p>${s}</p></div></div><div class="row"><span class="tg">${ic('cap')}BSc. Computer Science</span>${x[0]||''}</div><p>${x[1]}</p><div class="row"><span style="color:var(--mute);font-size:12px">${x[2]}</span><button class="ghost">${x[3]}</button></div></div>`;
const P={
dash:()=>`<div class="bn"><small>GOOD MORNING</small><h2>Welcome back, Ama</h2></div><div class="st4">${[["Linked students","1","In your care"],["Upcoming lessons","1","Next 14 days"],["Homework due","1","Looking good"],["Attendance","0%","No records yet"]].map(s=>`<div class="sc"><small>${s[0]}<span>→</span></small><b>${s[1]}</b><span>${s[2]}</span></div>`).join('')}</div>
<div class="dg"><div class="cd"><div class="row"><div><h3 style="font-size:18px">Timetable</h3><p>August 3 – 7</p></div><span class="chips" style="margin:0 0 0 auto"><span class="ch on">This week</span><span class="ch">Day</span></span></div><div class="tt"><i></i>${["MON 3","TUE 4","WED 5","THU 6","FRI 7"].map(d=>`<div class="h">${d.split(' ')[0]}<b>${d.split(' ')[1]}</b></div>`).join('')}${TT.map(r=>`<div class="t">${r[0]}</div>`+r.slice(1).map(c=>`<div class="s" style="background:${K[c]}">${c}</div>`).join('')).join('')}</div></div>
<div class="cd"><div class="row"><h3 style="font-size:18px">Announcements</h3><b class="ghost" style="border:0;padding:0;color:var(--p1)">View all →</b></div>${AN.slice(0,4).map(a=>`<div class="an"><span class="ib">${ic('mega')}</span><div><h3>${a[0]}<span class="tg ${PC[a[1]]}">${a[1]}</span></h3><p>${a[2]}</p></div></div>`).join('')}</div></div>`,
stu:()=>H('Students','Search and view students linked to your account')+B('Search by name, email, or class...')+SH(1,'student')+`<div class="gr"><div class="cd"><div class="row"><span class="av" style="width:42px;height:42px;border-radius:12px"></span><div><h3>Kofi Asante</h3><p>Ama Asante</p></div></div><div class="row" style="flex-wrap:wrap"><span class="tg">Accra</span><span class="tg g">Active</span><span class="tg">BSc. Computer Science</span></div><p>Admitted 7 Aug 2026</p><div class="row"><b style="color:#23895B">Paid in full</b><button class="ghost">View Profile</button></div></div></div>`,
les:()=>H('Lessons','Browse lesson plans and upcoming teaching sessions')+B('Search by title, course, or class...',S('SUBJECTS / COURSES','All subjects / courses'))+SH(3,'lessons')+`<div class="gr">${[["Orientation & Course Outline","Sat 25 Jul"],["Core Concepts Workshop","Sat 1 Aug"],["Project Kickoff Session","Sun 9 Aug"]].map(l=>la(l[0],'Algebra 1',['',l[0]+' for BSc. Computer Science',l[1]+' · 09:00 · 90 min','View Plan'])).join('')}</div>`,
hw:()=>H('Homeworks','Browse assigned homework and upcoming due dates')+B('Search by title, course, or class...',S('SUBJECTS / COURSES','All subjects / courses'))+SH(1,'homework')+`<div class="gr">${la('GH284 Weekly Assignment','Algebra 1',['','Complete the weekly reading and submit a one-page summary.','Due Tue 11 Aug','View'])}</div>`,
ex:()=>H('Exams','Browse assessments, schedules, and exam sessions')+B('Search by title, subject, class, or venue...',S('STATUS','All statuses'))+SH(1,'exam')+`<div class="gr">${la('GH284 Progress Test','Algebra 1 · Unit test',['<span class="tg g">Completed</span>','Thu 30 Jul · 10:00 – 11:30 AM · Main Campus','50 marks · pass 25','View'])}</div>`,
att:()=>`<div class="bar"><div class="in">${ic('search')}<input placeholder="Search by lesson, subject, class, or student..."></div>${S('STATUS','All statuses')}</div><div class="cd" style="padding:22px"><small style="color:var(--mute);letter-spacing:.1em">YOUR ATTENDANCE</small><h3 style="font-size:22px">Presence at a glance</h3><div class="row" style="justify-content:space-around;flex-wrap:wrap;gap:24px;margin-top:10px"><div class="rg">No records<br>yet</div><div style="flex:1;min-width:260px;max-width:420px">${[["Present","#DDF3E8"],["Absent","#FADADD"],["Late","#FCEBC8"],["Excused","#DCEBF5"]].map(p=>`<div class="pr"><i style="background:${p[1]}"></i><div><div class="row"><span>${p[0]}</span><b style="margin-left:auto">0</b></div><u></u></div></div>`).join('')}</div></div></div><div class="cd em" style="margin-top:16px"><b>No attendance yet</b>Attendance marked for your lessons will appear here.</div>`,
cmp:()=>H('Complaints','Search and review incidents between students, teachers, and guardians')+B('Search by title, ID, person, or category...',S('URGENCY','All urgencies')).replace('</div></div>','</div></div>').replace('Search</button>','Search</button><button class="pb" onclick="md.classList.add(\'on\')">'+ic('plus')+'Make complaint</button>')+C(['All','Open','Under Review','Resolved'])+`<div class="st4">${[["Open","tb0"],["Under review","ta"],["Urgent active","tr"],["Resolved","tg2"]].map(s=>`<div class="sc ${s[1]=='tb0'?'':s[1]}"><small>${s[0]}</small><b>0</b></div>`).join('')}</div>`+SH(0,'complaints')+`<div class="cd em"><b>No complaints yet</b>Try a different search, status, or urgency filter.</div>`,
ann:()=>H('Announcements','School notices relevant to your account')+B('Search by title or details...')+C(['All','High','Medium','Low'])+C(['All categories','General','Academic','Disciplinary','Other'])+SH(6,'announcements')+`<div class="gr">${AN.map(a=>`<div class="cd"><div class="row"><span class="dt">AUG<b>6</b></span><div><h3>${a[0]}</h3><p>${a[3]}</p></div></div><div class="row"><span class="tg ${PC[a[1]]}">${a[1]}</span><span class="tg">${ic('tag')}${a[4]}</span></div><p>${a[2]}</p><div class="row"><span style="color:var(--mute);font-size:12px">Posted 6 Aug 2026</span><button class="ghost">View Notice</button></div></div>`).join('')}</div>`,
pay:()=>H('Payments','Track invoices and payments for your students')+B('Search by student, title, ID, or receipt...',S('FEE TYPE','All fee types'))+C(['All','Invoices','Payments'])+C(['All','Paid','Partial','Pending','Overdue'])+`<div class="st4">${[["Outstanding","USD 750","ta"],["Paid","USD 0","tg2"],["Open invoices","1","tbl"],["Overdue","0",""]].map(s=>`<div class="sc ${s[2]}"><small>${s[0]}</small><b>${s[1]}</b></div>`).join('')}</div>`+SH(1,'record')+`<div class="gr"><div class="cd"><div class="row"><span class="dt">AUG<b>9</b></span><div><div class="row"><span class="tg a">Invoice</span><span class="tg">Pending</span></div><h3 style="margin-top:6px">Invoice for Tuition, First Term</h3><p>Kofi Asante · Tuition</p></div></div><div class="row"><div><small style="color:var(--mute)">BALANCE</small><b class="hd" style="display:block;font-size:20px;color:#C23A52">USD 750</b></div><div style="margin-left:auto;text-align:right"><small style="color:var(--mute)">DUE</small><b style="display:block">9 Aug</b></div></div><div class="row"><button class="pb" style="margin-left:auto;height:40px">Pay invoice</button></div></div></div>`};
const nv=document.getElementById('nv');
function go(id){N.forEach((n,i)=>nv.children[i].classList.toggle('on',n[0]==id));const n=N.find(x=>x[0]==id);tt.textContent=n[1];ts.textContent=n[3];ct.innerHTML=P[id]();sb.classList.remove('open')}
N.forEach(n=>{const d=document.createElement('div');d.className='nv';d.innerHTML=ic(n[2])+n[1];d.onclick=()=>go(n[0]);nv.appendChild(d)});
tg.onclick=()=>sb.classList.toggle('open');mx.onclick=mc2.onclick=()=>md.classList.remove('on');
ct.addEventListener('click',e=>{const c=e.target.closest('.ch');if(c){[].forEach.call(c.parentNode.children,x=>x.classList.remove('on'));c.classList.add('on')}});
go('dash');
</script></body></html>
